name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-server:
    name: MCP Server (TypeScript)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
      
      - name: Type check
        working-directory: mcp-server
        run: npm run typecheck
      
      - name: Build
        working-directory: mcp-server
        run: npm run build
      
      - name: Run tests
        working-directory: mcp-server
        run: npm run test

  mac-client:
    name: Mac Client (Swift)
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.app
      
      - name: Build
        run: |
          xcodebuild -project TierSpec/TierSpec.xcodeproj \
            -scheme TierSpec \
            -destination 'platform=macOS' \
            build
      
      - name: Run tests
        run: |
          xcodebuild -project TierSpec/TierSpec.xcodeproj \
            -scheme TierSpec \
            -destination 'platform=macOS' \
            test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
      
      - name: ESLint
        working-directory: mcp-server
        run: npm run lint || echo "No lint script configured"
